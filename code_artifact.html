<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts (Tajawal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-offwhite: #fbf9f9;
            --surface-white: #ffffff;
            --pink-main: #f48fb1;
            --pink-hover: #f06292;
            --pink-light: #fce4ec;
            --text-main: #374151;
            --text-muted: #9ca3af;
            --shadow-notion: 0 4px 20px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0,0,0,0.02);
            --danger-light: #fee2e2;
            --danger-main: #ef4444;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-offwhite);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .notion-card {
            background-color: var(--surface-white);
            border-radius: 16px;
            box-shadow: var(--shadow-notion);
            border: 1px solid rgba(0,0,0,0.02);
            transition: all 0.3s ease;
        }

        /* إخفاء شريط التمرير الافتراضي */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* تأثيرات حركية */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: scale(0.95); }
            to { opacity: 0; transform: scale(0.9); }
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .task-enter { animation: slideIn 0.3s ease-out forwards; }
        .task-leave { animation: fadeOut 0.3s ease-in forwards; }
        .modal-enter { animation: fadeInScale 0.3s ease-out forwards; }

        /* تخصيص حقول الإدخال */
        .soft-input {
            background-color: var(--bg-offwhite);
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .soft-input:focus {
            background-color: var(--surface-white);
            border-color: var(--pink-main);
            box-shadow: 0 0 0 3px var(--pink-light);
            outline: none;
        }

        /* تخصيص الأزرار */
        .btn-primary {
            background-color: var(--pink-main);
            color: white;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background-color: var(--pink-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(244, 143, 177, 0.3);
        }

        /* تخصيص زر الاختيار (Checkbox) */
        .custom-checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background-color: white;
        }
        .custom-checkbox:hover { border-color: var(--pink-main); }
        .custom-checkbox:checked {
            background-color: var(--pink-main);
            border-color: var(--pink-main);
        }
        .custom-checkbox::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: white;
            font-size: 12px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.2s ease;
        }
        .custom-checkbox:checked::after { opacity: 1; transform: scale(1); }

        .task-text.completed { text-decoration: line-through; color: var(--text-muted); opacity: 0.7; }

        /* خط المؤقت */
        .timer-text { font-variant-numeric: tabular-nums; letter-spacing: 1px; }
        
        /* علامات مميزة (Badges) */
        .badge {
            background-color: var(--pink-light);
            color: var(--pink-hover);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge.danger {
            background-color: var(--danger-light);
            color: var(--danger-main);
        }
    </style>
</head>

<body class="max-w-5xl mx-auto flex flex-col gap-8 relative">

    <!-- Header Section -->
    <header class="flex flex-col items-center text-center pt-4">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4 tracking-tight">
            To Do List <i class="fa-solid fa-sparkles text-[var(--pink-main)] ms-1"></i>
 </h1>
<p>نظم وقتك، لتحقق اهدافك🌸</p>
        </h1>
        
        <!-- Live Date & Time Badge -->
        <div class="bg-white shadow-sm border border-gray-100 px-5 py-2.5 rounded-full flex items-center gap-3 text-gray-600 font-medium">
            <i class="fa-regular fa-calendar-days text-[var(--pink-main)]"></i>
            <span id="live-datetime" class="text-sm md:text-base">جاري التحميل...</span>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <section class="notion-card p-6 flex flex-col items-center relative overflow-hidden">
            <div class="w-full flex justify-between items-center mb-6 z-10">
                <h2 class="font-bold text-gray-700 flex items-center gap-2">
                    <i class="fa-solid fa-stopwatch text-[var(--pink-main)]"></i>
                    التركيز والوقت
                </h2>
                <!-- Tabs for Timer Mode -->
                <div class="flex bg-[var(--bg-offwhite)] rounded-lg p-1 text-sm border border-gray-100">
                    <button id="mode-countdown" class="px-3 py-1.5 rounded-md text-[var(--pink-main)] bg-white shadow-sm font-bold transition-all">عد تنازلي</button>
                    <button id="mode-stopwatch" class="px-3 py-1.5 rounded-md text-gray-500 hover:text-gray-700 transition-all">ساعة إيقاف</button>
                </div>
            </div>

            <!-- Minutes Input for Countdown -->
            <div id="countdown-input-group" class="flex flex-col items-center mb-2 z-10 transition-opacity">
                <label class="text-xs text-gray-400 mb-1 font-medium">المدة (دقائق):</label>
                <input type="number" id="timer-minutes" min="1" value="25" class="soft-input w-24 text-center py-1.5 rounded-lg font-bold text-gray-700">
            </div>

            <!-- Timer Display -->
            <div class="timer-text text-6xl md:text-7xl font-bold text-gray-800 mb-8 z-10" id="timer-display">25:00</div>
            
            <!-- Controls -->
            <div class="flex gap-4 z-10">
                <button id="btn-start" class="btn-primary w-14 h-14 rounded-full flex items-center justify-center text-xl shadow-md">
                    <i class="fa-solid fa-play ms-1"></i>
                </button>
                <button id="btn-pause" class="bg-gray-100 text-gray-600 hover:bg-gray-200 w-14 h-14 rounded-full flex items-center justify-center text-xl transition-colors">
                    <i class="fa-solid fa-pause"></i>
                </button>
                <button id="btn-reset" class="bg-gray-100 text-gray-600 hover:bg-gray-200 w-14 h-14 rounded-full flex items-center justify-center text-xl transition-colors">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
            
            <!-- Ambient Glow Effect -->
            <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-[var(--pink-light)] rounded-full opacity-50 blur-3xl pointer-events-none"></div>
        </section>

        <section class="notion-card p-6 flex flex-col justify-center relative">
            <h2 class="font-bold text-gray-700 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-chart-pie text-[var(--pink-main)]"></i>
                معدل الإنجاز
            </h2>
            
            <div class="flex justify-between items-end mb-4">
                <span class="text-sm font-medium text-gray-500" id="progress-subtitle">جميع المهام المعروضة</span>
                <span class="text-4xl font-extrabold text-[var(--pink-main)] tracking-tight" id="progress-percent">0%</span>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full h-4 bg-[var(--bg-offwhite)] rounded-full overflow-hidden border border-gray-50">
                <div id="progress-bar" class="h-full bg-[var(--pink-main)] rounded-full transition-all duration-1000 ease-out relative overflow-hidden" style="width: 0%;">
                    <!-- Shine effect on progress bar -->
                    <div class="absolute inset-0 bg-white/20 w-full h-full transform -skew-x-12 translate-x-full"></div>
                </div>
            </div>
            
            <p class="text-sm text-gray-400 mt-5 text-center font-medium" id="progress-msg">في انتظار مهامك الجديدة...</p>
        </section>
    </div>

    <section class="notion-card p-4 md:p-8 flex flex-col mb-8">
        
        <!-- Add Task Form -->
        <form id="task-form" class="flex flex-col lg:flex-row gap-3 mb-8 bg-[var(--bg-offwhite)] p-3 md:p-4 rounded-2xl border border-gray-100">
            <input type="text" id="task-text" placeholder="ما هي مهمتك القادمة؟..." class="soft-input flex-1 rounded-xl px-4 py-3 bg-white shadow-sm font-medium" required>
            
            <div class="flex flex-wrap md:flex-nowrap gap-2 items-center">
                <!-- Date Picker (Defaults to Today in JS) -->
                <input type="date" id="task-date" class="soft-input rounded-xl px-3 py-3 bg-white text-gray-600 text-sm w-full md:w-auto shadow-sm" required>
                <!-- Time Picker -->
                <input type="time" id="task-time" class="soft-input rounded-xl px-3 py-3 bg-white text-gray-600 text-sm w-full md:w-auto shadow-sm">
                
                <button type="submit" class="btn-primary w-full md:w-auto rounded-xl px-6 py-3 font-bold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>إضافة</span>
                </button>
            </div>
        </form>

        <!-- Smart Filters -->
        <div class="flex flex-wrap gap-2 md:gap-3 mb-6 pb-2" id="smart-filters">
            <button data-filter="all" class="px-5 py-2 rounded-xl text-sm bg-[var(--pink-main)] text-white font-bold shadow-md transition-all">الكل</button>
            <button data-filter="today" class="px-5 py-2 rounded-xl text-sm bg-gray-50 text-gray-600 hover:bg-gray-100 transition-all font-medium border border-gray-100">اليوم</button>
            <button data-filter="upcoming" class="px-5 py-2 rounded-xl text-sm bg-gray-50 text-gray-600 hover:bg-gray-100 transition-all font-medium border border-gray-100">القادمة</button>
            <button data-filter="missed" class="px-5 py-2 rounded-xl text-sm bg-gray-50 text-red-500 hover:bg-red-50 transition-all font-medium border border-gray-100 flex items-center gap-1">
                <i class="fa-solid fa-circle-exclamation"></i> الفائتة
            </button>
            <button data-filter="completed" class="px-5 py-2 rounded-xl text-sm bg-gray-50 text-green-600 hover:bg-green-50 transition-all font-medium border border-gray-100">المكتملة</button>
        </div>

        <!-- Task List -->
        <div class="flex-1 min-h-[300px] flex flex-col gap-3" id="task-list">
            <!-- سيتم حقن المهام هنا بواسطة جافاسكريبت -->
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="hidden flex-col items-center justify-center h-48 text-gray-400 gap-3">
            <i class="fa-solid fa-leaf text-4xl text-[var(--pink-light)] mb-2"></i>
            <p class="font-medium text-lg text-gray-500">لا توجد مهام في هذا التصنيف</p>
            <p class="text-sm">الوقت مناسب لأخذ قسط من الراحة 🌸</p>
        </div>
        
        <!-- Clear Completed Tasks Button -->
        <div class="mt-8 pt-4 border-t border-gray-100 flex justify-end">
            <button id="btn-clear" class="text-sm text-gray-400 hover:text-red-500 transition-colors flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-red-50 font-medium">
                <i class="fa-solid fa-broom"></i>
                تنظيف المهام المكتملة
            </button>
        </div>
    </section>

    <div id="postpone-modal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center hidden z-50 transition-opacity">
        <div class="modal-enter bg-white p-6 md:p-8 rounded-2xl shadow-2xl max-w-sm w-full mx-4 relative border border-gray-100">
            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-calendar-plus text-[var(--pink-main)]"></i> تأجيل المهمة
            </h3>
            <p class="text-sm text-gray-500 mb-6 bg-gray-50 p-3 rounded-lg border border-gray-100" id="postpone-task-name">اسم المهمة</p>
            
            <div class="flex flex-col gap-4 mb-8">
                <div>
                    <label class="text-sm font-medium text-gray-700 mb-2 block">تاريخ جديد:</label>
                    <input type="date" id="postpone-date" class="soft-input rounded-xl px-4 py-2.5 bg-[var(--bg-offwhite)] text-gray-700 w-full border border-gray-200">
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-700 mb-2 block">وقت جديد (اختياري):</label>
                    <input type="time" id="postpone-time" class="soft-input rounded-xl px-4 py-2.5 bg-[var(--bg-offwhite)] text-gray-700 w-full border border-gray-200">
                </div>
            </div>

            <div class="flex justify-end gap-3">
                <button id="btn-cancel-postpone" class="px-5 py-2.5 rounded-xl text-gray-600 hover:bg-gray-100 transition-all font-bold">إلغاء</button>
                <button id="btn-save-postpone" class="btn-primary px-6 py-2.5 rounded-xl font-bold shadow-md">حفظ التأجيل</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            /* ==========================================
               1. LIVE DATE & TIME (الساعة والتاريخ المباشر)
               ========================================== */
            const liveDatetimeEl = document.getElementById('live-datetime');
            
            const updateLiveClock = () => {
                const now = new Date();
                const options = { 
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit', hour12: true
                };
                // Use Arabic localization
                liveDatetimeEl.textContent = now.toLocaleDateString('ar-EG', options).replace('،', ' -');
            };
            
            updateLiveClock();
            setInterval(updateLiveClock, 60000); // Update every minute


            /* ==========================================
               2. TIMER LOGIC (العد التنازلي وساعة الإيقاف)
               ========================================== */
            let timerInterval;
            let timerSeconds = 25 * 60;
            let timerMode = 'countdown';
            let isRunning = false;

            const timerDisplay = document.getElementById('timer-display');
            const btnStart = document.getElementById('btn-start');
            const btnPause = document.getElementById('btn-pause');
            const btnReset = document.getElementById('btn-reset');
            const modeStopwatchBtn = document.getElementById('mode-stopwatch');
            const modeCountdownBtn = document.getElementById('mode-countdown');
            const countdownInputGroup = document.getElementById('countdown-input-group');
            const timerMinutesInput = document.getElementById('timer-minutes');

            // Format seconds to MM:SS or HH:MM:SS
            const formatTime = (totalSec) => {
                const h = Math.floor(totalSec / 3600);
                const m = Math.floor((totalSec % 3600) / 60);
                const s = totalSec % 60;
                if (h > 0) return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const updateTimerUI = () => {
                timerDisplay.textContent = formatTime(timerSeconds);
            };

            const switchTimerMode = (mode) => {
                if(isRunning) pauseTimer();
                timerMode = mode;
                if (mode === 'stopwatch') {
                    modeStopwatchBtn.className = "px-3 py-1.5 rounded-md text-[var(--pink-main)] bg-white shadow-sm font-bold transition-all";
                    modeCountdownBtn.className = "px-3 py-1.5 rounded-md text-gray-500 hover:text-gray-700 transition-all";
                    countdownInputGroup.classList.add('hidden'); countdownInputGroup.classList.remove('flex');
                    timerSeconds = 0;
                } else {
                    modeCountdownBtn.className = "px-3 py-1.5 rounded-md text-[var(--pink-main)] bg-white shadow-sm font-bold transition-all";
                    modeStopwatchBtn.className = "px-3 py-1.5 rounded-md text-gray-500 hover:text-gray-700 transition-all";
                    countdownInputGroup.classList.remove('hidden'); countdownInputGroup.classList.add('flex');
                    timerSeconds = Math.max(1, parseInt(timerMinutesInput.value) || 25) * 60;
                }
                updateTimerUI();
            };

            timerMinutesInput.addEventListener('input', () => {
                if (timerMode === 'countdown' && !isRunning) {
                    timerSeconds = Math.max(1, (parseInt(timerMinutesInput.value) || 1)) * 60;
                    updateTimerUI();
                }
            });

            modeStopwatchBtn.addEventListener('click', () => switchTimerMode('stopwatch'));
            modeCountdownBtn.addEventListener('click', () => switchTimerMode('countdown'));

            const startTimer = () => {
                if (isRunning || (timerMode === 'countdown' && timerSeconds <= 0)) return;
                isRunning = true;
                timerInterval = setInterval(() => {
                    if (timerMode === 'stopwatch') {
                        timerSeconds++;
                    } else {
                        timerSeconds--;
                        if (timerSeconds <= 0) {
                            pauseTimer();
                            timerSeconds = 0;
                            // Visual cue when finished
                            timerDisplay.classList.add('text-[var(--pink-main)]');
                            setTimeout(() => timerDisplay.classList.remove('text-[var(--pink-main)]'), 3000);
                        }
                    }
                    updateTimerUI();
                }, 1000);
            };

            const pauseTimer = () => {
                clearInterval(timerInterval);
                isRunning = false;
            };

            const resetTimer = () => {
                pauseTimer();
                if (timerMode === 'stopwatch') {
                    timerSeconds = 0;
                } else {
                    timerSeconds = Math.max(1, parseInt(timerMinutesInput.value) || 25) * 60;
                }
                updateTimerUI();
            };

            btnStart.addEventListener('click', startTimer);
            btnPause.addEventListener('click', pauseTimer);
            btnReset.addEventListener('click', resetTimer);

            // Initialize Timer Display
            updateTimerUI();


            /* ==========================================
               3. TASK MANAGEMENT LOGIC (إدارة المهام والفلاتر)
               ========================================== */
            // Load from Local Storage
            let tasks = JSON.parse(localStorage.getItem('shrouk_tasks_v2')) || [];
            let currentFilter = 'all'; // all, today, upcoming, missed, completed
            let taskToPostponeId = null; 

            // Set default date input to today
            const taskDateInput = document.getElementById('task-date');
            const todayStr = new Date().toLocaleDateString('en-CA'); // 'YYYY-MM-DD' format
            taskDateInput.value = todayStr;

            const taskForm = document.getElementById('task-form');
            const taskList = document.getElementById('task-list');
            const emptyState = document.getElementById('empty-state');
            
            const progressBar = document.getElementById('progress-bar');
            const progressPercent = document.getElementById('progress-percent');
            const progressMsg = document.getElementById('progress-msg');

            const postponeModal = document.getElementById('postpone-modal');
            const postponeNameText = document.getElementById('postpone-task-name');
            const postponeDateInput = document.getElementById('postpone-date');
            const postponeTimeInput = document.getElementById('postpone-time');

            // Utilities
            const saveTasks = () => localStorage.setItem('shrouk_tasks_v2', JSON.stringify(tasks));
            const escapeHTML = (str) => { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; };

            // Function to check if a task is Missed based on exact Date and Time
            const evaluateTaskStatus = (task) => {
                const now = new Date();
                
                // If no time is provided, we assume the task is due at the END of that day (23:59:59)
                const taskTimeStr = task.time || '23:59:59';
                
                // Create a comparable Date object from task date and time
                const taskDateTime = new Date(`${task.date}T${taskTimeStr}`);
                
                // A task is missed ONLY if its precise datetime is in the past, and it's not completed
                task.isMissed = (taskDateTime < now) && !task.completed;
            };

            // Update Progress Bar
            const updateProgress = (displayTasks) => {
                const total = displayTasks.length;
                const completed = displayTasks.filter(t => t.completed).length;
                const pct = total === 0 ? 0 : Math.round((completed / total) * 100);

                progressBar.style.width = `${pct}%`;
                progressPercent.textContent = `${pct}%`;

                if (total === 0) progressMsg.textContent = 'لا توجد مهام حالياً.';
                else if (pct === 0) progressMsg.textContent = 'بداية موفقة، لننجز أول مهمة!';
                else if (pct === 100) progressMsg.textContent = 'أنجزتِ كل شيء! عمل رائع يا شروق 🌸';
                else progressMsg.textContent = `متبقي ${total - completed} مهام، استمري!`;
            };

            // Render tasks to screen
            const renderTasks = () => {
                taskList.innerHTML = '';
                
                // First, evaluate missed status for all tasks dynamically based on current real time
                tasks.forEach(evaluateTaskStatus);

                // Filter logic
                const todayStrLocal = new Date().toLocaleDateString('en-CA');
                const now = new Date();

                let filteredTasks = tasks.filter(task => {
                    if (currentFilter === 'all') return true;
                    if (currentFilter === 'completed') return task.completed;
                    
                    if (currentFilter === 'today') {
                        return task.date === todayStrLocal;
                    }
                    
                    if (currentFilter === 'upcoming') {
                        const taskTimeStr = task.time || '23:59:59';
                        const taskDateTime = new Date(`${task.date}T${taskTimeStr}`);
                        return taskDateTime >= now && !task.completed;
                    }
                    
                    if (currentFilter === 'missed') {
                        return task.isMissed;
                    }
                    return true;
                });

                // Update progress based on the current active view (or overall if preferred)
                updateProgress(filteredTasks);

                if (filteredTasks.length === 0) {
                    emptyState.classList.remove('hidden'); emptyState.classList.add('flex');
                } else {
                    emptyState.classList.add('hidden'); emptyState.classList.remove('flex');

                    // Sort: Missed first, then pending by date/time, completed last
                    filteredTasks.sort((a, b) => {
                        if (a.completed !== b.completed) return a.completed ? 1 : -1;
                        if (a.isMissed !== b.isMissed) return a.isMissed ? -1 : 1;
                        
                        const dateA = new Date(`${a.date}T${a.time || '23:59'}`);
                        const dateB = new Date(`${b.date}T${b.time || '23:59'}`);
                        return dateA - dateB;
                    });

                    filteredTasks.forEach(task => {
                        const li = document.createElement('div');
                        // Add red border if missed
                        const borderClass = task.isMissed ? 'border-red-200 shadow-sm bg-red-50/20' : 'border-gray-100 bg-white';
                        li.className = `task-enter flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-xl border ${borderClass} hover:shadow-md transition-all group gap-4`;
                        
                        // Format Time for display (12 hours)
                        let timeString = '';
                        if (task.time) {
                            const [h, m] = task.time.split(':');
                            let hour = parseInt(h);
                            const ampm = hour >= 12 ? 'م' : 'ص';
                            hour = hour % 12 || 12;
                            timeString = `${hour}:${m} ${ampm}`;
                        }

                        // Format Date for display
                        const taskDateObj = new Date(task.date);
                        const displayDate = taskDateObj.toLocaleDateString('ar-EG', { weekday: 'short', month: 'short', day: 'numeric' });

                        li.innerHTML = `
                            <div class="flex items-start sm:items-center gap-4 flex-1 cursor-pointer" onclick="document.getElementById('chk-${task.id}').click()">
                                <input type="checkbox" id="chk-${task.id}" class="custom-checkbox mt-1 sm:mt-0" ${task.completed ? 'checked' : ''} onclick="event.stopPropagation()">
                                <div class="flex flex-col gap-1.5">
                                    <span class="task-text font-bold text-lg transition-all ${task.completed ? 'completed' : 'text-gray-800'}">${escapeHTML(task.text)}</span>
                                    <div class="flex gap-2 flex-wrap items-center">
                                        <span class="badge"><i class="fa-regular fa-calendar"></i> ${displayDate}</span>
                                        ${timeString ? `<span class="badge bg-blue-50 text-blue-600"><i class="fa-regular fa-clock"></i> ${timeString}</span>` : ''}
                                        ${task.isMissed ? `<span class="badge danger animate-pulse"><i class="fa-solid fa-triangle-exclamation"></i> فائتة</span>` : ''}
                                    </div>
                                </div>
                            </div>
                            <div class="flex gap-2 sm:opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition-opacity justify-end">
                                <button class="postpone-btn text-gray-500 hover:text-blue-600 bg-gray-50 hover:bg-blue-100 px-3 py-2 rounded-lg flex items-center gap-2 transition-all text-sm font-medium" title="تأجيل">
                                    <i class="fa-solid fa-calendar-plus"></i> <span class="sm:hidden">تأجيل</span>
                                </button>
                                <button class="delete-btn text-gray-500 hover:text-red-600 bg-gray-50 hover:bg-red-100 px-3 py-2 rounded-lg flex items-center gap-2 transition-all text-sm font-medium" title="حذف">
                                    <i class="fa-solid fa-trash-can"></i> <span class="sm:hidden">حذف</span>
                                </button>
                            </div>
                        `;

                        // Attach Events
                        li.querySelector('.custom-checkbox').addEventListener('change', (e) => {
                            e.stopPropagation(); toggleTask(task.id);
                        });

                        li.querySelector('.delete-btn').addEventListener('click', (e) => {
                            e.stopPropagation(); deleteTask(task.id, li);
                        });

                        li.querySelector('.postpone-btn').addEventListener('click', (e) => {
                            e.stopPropagation(); openPostponeModal(task);
                        });

                        taskList.appendChild(li);
                    });
                }
            };

            // Toggle Complete
            const toggleTask = (id) => {
                tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
                saveTasks();
                setTimeout(renderTasks, 250); // slight delay for visual feedback
            };

            // Delete Task
            const deleteTask = (id, element) => {
                element.classList.replace('task-enter', 'task-leave');
                setTimeout(() => {
                    tasks = tasks.filter(t => t.id !== id);
                    saveTasks(); 
                    renderTasks();
                }, 300);
            };

            // Add Task Form Submit
            taskForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const textInput = document.getElementById('task-text');
                const timeInput = document.getElementById('task-time');
                
                if (!textInput.value.trim() || !taskDateInput.value) return;

                tasks.push({
                    id: Date.now().toString(),
                    text: textInput.value.trim(),
                    date: taskDateInput.value, // YYYY-MM-DD
                    time: timeInput.value,     // HH:mm (24h) or empty
                    completed: false,
                    isMissed: false
                });
                
                saveTasks();
                textInput.value = '';
                timeInput.value = '';
                
                // Switch to 'all' or 'today' view if adding a task and currently in 'completed'
                if(currentFilter === 'completed' || currentFilter === 'missed') {
                    document.querySelector(`[data-filter="all"]`).click();
                } else {
                    renderTasks();
                }
            });

            // Postpone Modal Functions
            const openPostponeModal = (task) => {
                taskToPostponeId = task.id;
                postponeNameText.textContent = `"${task.text}"`;
                postponeDateInput.value = task.date;
                postponeTimeInput.value = task.time || "";
                postponeModal.classList.remove('hidden');
            };

            const closePostponeModal = () => {
                postponeModal.classList.add('hidden');
                taskToPostponeId = null;
            };

            document.getElementById('btn-cancel-postpone').addEventListener('click', closePostponeModal);
            
            document.getElementById('btn-save-postpone').addEventListener('click', () => {
                if(!taskToPostponeId || !postponeDateInput.value) return;
                
                tasks = tasks.map(t => {
                    if (t.id === taskToPostponeId) {
                        return { ...t, date: postponeDateInput.value, time: postponeTimeInput.value, isMissed: false };
                    }
                    return t;
                });
                
                saveTasks();
                closePostponeModal();
                
                // Automatically switch to 'upcoming' or 'all' to show the postponed task clearly
                if(currentFilter === 'missed') document.querySelector(`[data-filter="all"]`).click();
                else renderTasks();
            });

            // Clear Completed Tasks
            document.getElementById('btn-clear').addEventListener('click', () => {
                const completedTasks = tasks.filter(t => t.completed);
                if(completedTasks.length === 0) return;
                
                // Visual exit for completed tasks currently in view
                document.querySelectorAll('.custom-checkbox:checked').forEach(chk => {
                    const el = chk.closest('.task-enter');
                    if(el) el.classList.replace('task-enter', 'task-leave');
                });
                
                setTimeout(() => {
                    tasks = tasks.filter(t => !t.completed);
                    saveTasks(); 
                    renderTasks();
                }, 300);
            });

            // Smart Filters Click Events
            document.querySelectorAll('#smart-filters button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Reset all buttons styling
                    document.querySelectorAll('#smart-filters button').forEach(b => {
                        b.className = "px-5 py-2 rounded-xl text-sm bg-gray-50 text-gray-600 hover:bg-gray-100 transition-all font-medium border border-gray-100";
                        if(b.dataset.filter === 'missed') b.classList.add('text-red-500', 'hover:bg-red-50', 'flex', 'items-center', 'gap-1');
                        if(b.dataset.filter === 'completed') b.classList.add('text-green-600', 'hover:bg-green-50');
                    });
                    
                    // Style active button
                    const targetBtn = e.target.closest('button');
                    currentFilter = targetBtn.dataset.filter;
                    
                    if (currentFilter === 'missed') {
                        targetBtn.className = "px-5 py-2 rounded-xl text-sm bg-red-500 text-white font-bold shadow-md transition-all flex items-center gap-1 border border-red-500";
                    } else if (currentFilter === 'completed') {
                        targetBtn.className = "px-5 py-2 rounded-xl text-sm bg-green-500 text-white font-bold shadow-md transition-all border border-green-500";
                    } else {
                        targetBtn.className = "px-5 py-2 rounded-xl text-sm bg-[var(--pink-main)] text-white font-bold shadow-md transition-all border border-[var(--pink-main)]";
                    }
                    
                    renderTasks();
                });
            });

            // Real-time evaluation of "Missed" tasks every 15 seconds
            // This ensures if a task deadline passes while the user is looking at the screen, it updates automatically.
            setInterval(() => {
                let statusChanged = false;
                const now = new Date();
                
                tasks.forEach(task => {
                    if (task.completed) return;
                    
                    const taskTimeStr = task.time || '23:59:59';
                    const taskDateTime = new Date(`${task.date}T${taskTimeStr}`);
                    const currentlyMissed = taskDateTime < now;
                    
                    if (task.isMissed !== currentlyMissed) {
                        task.isMissed = currentlyMissed;
                        statusChanged = true;
                    }
                });

                if (statusChanged) {
                    saveTasks();
                    renderTasks();
                }
            }, 15000); // 15 seconds interval

            // Initial Render
            renderTasks();
        });
    </script>
</body>
</html>
